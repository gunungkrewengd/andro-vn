name: Cloud Android VM (Portrait HP)

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Versi Android'
        required: true
        default: 'Android 11 (API 30)'
        type: choice
        options:
          - 'Android 11 (API 30)'
          - 'Android 12 (API 31)'
          - 'Android 13 (API 33)'
          - 'Android 14 (API 34)'
      duration_minutes:
        description: 'Durasi aktif dalam menit (maks 340)'
        required: true
        default: '340'
        type: string

jobs:
  android-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Bersihkan disk & aktifkan KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Pasang TigerVNC & noVNC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tigervnc-standalone-server novnc websockify libpulse0 libxcb-cursor0

      - name: Unduh Android & buat profil Portrait tanpa skin
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          API=$(echo "${{ inputs.android_version }}" | grep -oE 'API [0-9]+' | awk '{print $2}')

          yes | "$SDK_BIN/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_BIN/sdkmanager" "system-images;android-${API};google_apis;x86_64"

          echo "no" | "$SDK_BIN/avdmanager" create avd \
            -n phone \
            -k "system-images;android-${API};google_apis;x86_64" \
            -p "$ANDROID_AVD_HOME/phone.avd" \
            --force

          AVD_DIR="$ANDROID_AVD_HOME/phone.avd"
          if [ -f "$AVD_DIR/config.ini" ]; then
            grep -vE '^(hw\.lcd\.|hw\.ramSize|hw\.cpu\.ncore|hw\.keyboard|hw\.mainKeys|hw\.gpu\.|showDeviceFrame|skin\.|disk\.dataPartition)' "$AVD_DIR/config.ini" > "$AVD_DIR/config.ini.tmp" || true
            mv "$AVD_DIR/config.ini.tmp" "$AVD_DIR/config.ini"
          fi

          cat << 'EOF' >> "$AVD_DIR/config.ini"
          hw.lcd.width=540
          hw.lcd.height=1020
          hw.lcd.density=240
          hw.ramSize=4096
          hw.cpu.ncore=4
          hw.keyboard=yes
          hw.mainKeys=no
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          showDeviceFrame=no
          skin.dynamic=yes
          skin.name=540x1020
          skin.path=_no_skin
          disk.dataPartition.size=6144M
          EOF

          cat << 'EOF' > "$AVD_DIR/emulator-user.ini"
          window.x = 0
          window.y = 0
          window.scale = 1
          EOF

      - name: Jalankan Android Portrait & buat link Cloudflare
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          # Jalankan layar virtual + server VNC sekaligus (portrait 540x1020)
          Xvnc :1 -geometry 540x1020 -depth 24 -rfbport 5900 -SecurityTypes None -AlwaysShared -ac > xvnc.log 2>&1 &
          sleep 3

          if ! pgrep -x Xvnc >/dev/null; then
            echo "Xvnc gagal berjalan:"
            cat xvnc.log
            exit 1
          fi

          export DISPLAY=:1
          "$ANDROID_HOME/emulator/emulator" \
            -avd phone \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on > emulator.log 2>&1 &

          # Redirect otomatis ke noVNC auto-scale (pas di layar HP tanpa situs desktop)
          sudo tee /usr/share/novnc/index.html > /dev/null << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=true&resize=scale&reconnect=true&show_dot=false">
          </head>
          <body style="background:#000;margin:0;"></body>
          </html>
          EOF

          websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5900 > novnc.log 2>&1 &

          for i in $(seq 1 20); do
            if curl -s http://127.0.0.1:6080 >/dev/null; then break; fi
            sleep 2
          done

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:6080 > tunnel.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 20); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done

          echo "========================================================"
          echo "LINK ANDROID VM (PORTRAIT FULLSCREEN):"
          echo "$TUNNEL_URL"
          echo "========================================================"

          DURATION="${{ inputs.duration_minutes }}"
          if [ "$DURATION" -gt 340 ]; then DURATION=340; fi
          sleep $((DURATION * 60))
